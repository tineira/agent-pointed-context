<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APC: point your agent at any page</title>
    <style>
      :root { color-scheme: light dark; --bg: #faf8f5; --fg: #1f1f1f; --muted: #6b6b6b; --accent: #d4733a; --line: #e2ddd6; --card: #fff; --ok: #2e8b57; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161514; --fg: #f1efec; --muted: #a39f99; --line: #34312d; --card: #1f1e1c; --ok: #4cb37c; } }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 20px; }
      h1 { font-size: 26px; margin: 0; line-height: 1.25; }
      p { margin: 0; }
      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: step; }
      ol > li { counter-increment: step; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; }
      ol > li::before { content: counter(step) / ""; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 14px system-ui, sans-serif; margin-top: 3px; }
      ol > li.done::before { content: "\2713" / ""; background: var(--ok); }
      .step { display: grid; gap: 10px; justify-items: start; align-content: center; min-height: 34px; }
      button { font: inherit; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
      button.primary { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
      button:disabled { opacity: .6; cursor: default; }
      button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .ok { color: var(--ok); font-weight: 600; }
      .gest { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; justify-self: stretch; margin: 0; padding: 0; list-style: none; }
      .gest > li { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; font-size: 13px; text-align: center; }
      .mini { height: 62px; border-radius: 6px; background: var(--card); position: relative; overflow: hidden; }
      .mini i { position: absolute; left: 30%; right: 8%; height: 5px; border-radius: 3px; background: var(--line); }
      .mini .a { position: absolute; width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: #fff; font: 700 10px/18px system-ui, sans-serif; text-align: center; }
      .mini .o { position: absolute; left: 26%; right: 5%; top: 22px; height: 22px; border: 2px solid var(--accent); border-radius: 3px; }
      .mini .pin { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgb(0 0 0 / .25); }
      .mini .check { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); font-size: 8px; line-height: 12px; }
      details summary { cursor: pointer; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; width: fit-content; }
      details dl { margin: 10px 0 0; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px 12px; }
      details dt { font: 600 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 3px; }
      details dd { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Point your agent at any page</h1>
      <ol>
        <li id="step1">
          <div class="step">
            <button type="button" id="grant" class="primary">Allow on every site</button>
            <p id="granted" class="ok" hidden>Allowed on every site</p>
          </div>
        </li>
        <li>
          <div class="step"><button type="button" id="open-dock">Open dock</button></div>
        </li>
        <li>
          <div class="step">
            <b>Drag your agent onto a page</b>
            <ul class="gest">
              <li><div class="mini" aria-hidden="true"><span class="a" style="left:8px;top:22px">A</span><i style="top:14px"></i><i style="top:28px"></i><i style="top:42px"></i></div><span>Drag</span></li>
              <li><div class="mini" aria-hidden="true"><i style="top:8px"></i><span class="o"></span><i style="top:30px"></i><i style="top:52px"></i></div><span>Drop</span></li>
              <li><div class="mini" aria-hidden="true"><span class="a pin" style="left:10px;top:22px">A</span><span class="a check" style="left:21px;top:33px">&#10003;</span><i style="top:14px"></i><i style="top:28px"></i><i style="top:42px"></i></div><span>Read</span></li>
            </ul>
          </div>
        </li>
      </ol>
      <details>
        <summary id="sent-label"></summary>
        <dl>
          <dt id="goes-label"></dt><dd id="goes"></dd>
          <dt id="held-label"></dt><dd id="held"></dd>
          <dt id="where-label"></dt><dd id="where"></dd>
        </dl>
      </details>
    </main>
    <script type="module" src="welcome.js"></script>
  </body>
</html>
