<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>APC</title>
    <style>
      :root { color-scheme: light dark; --muted: #6b6b6b; --accent: #d4733a; --line: #d9d9d9; --warn: #a23b1d; }
      @media (prefers-color-scheme: dark) { :root { --muted: #a3a3a3; --line: #3a3a3a; --warn: #f08a6a; } }
      body { margin: 0; width: 340px; font: 13px/1.45 system-ui, sans-serif; }
      main { padding: 14px 16px; display: grid; gap: 12px; }
      h1 { font-size: 14px; margin: 0; }
      h2 { font-size: 12px; margin: 0 0 4px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
      p { margin: 0; }
      .muted { color: var(--muted); }
      .warn { color: var(--warn); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
      button.primary, button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      li span { overflow-wrap: anywhere; }
      label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
      input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Point your agent at any page</h1>
      <div class="row">
        <button type="button" id="open-dock" class="primary" title="Alt+Shift+A">Open dock</button>
        <button type="button" id="float" title="Alt+Shift+F: your dock opens ready to float your agents with one click">Float</button>
      </div>
      <section id="here"></section>
      <section id="any"></section>
      <section>
        <h2>When to ask</h2>
        <label><input type="checkbox" id="never-ask" /> <span><b>Never ask.</b> <span class="warn">Every drop is sent at once, on any site, even the ones set to ask every time.</span></span></label>
      </section>
      <section>
        <h2>Your sites</h2>
        <ul id="sites"></ul>
      </section>
      <section>
        <h2>Last drop</h2>
        <p id="last" class="muted">None yet.</p>
      </section>
      <section>
        <h2>Docks this browser sends to</h2>
        <ul id="docks"></ul>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
