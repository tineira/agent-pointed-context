<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>APC</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #d9d9d9; --soft: #f5f3f0; --brand: #d4733a; --ok: #2e8b57; --warn: #a23b1d; --wait: #c9912b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1c; --fg: #f0f0f0; --muted: #a3a3a3; --line: #3a3a3a; --soft: #262524; --ok: #6fd195; --warn: #f08a6a; } }
      [hidden] { display: none !important; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      body { width: 340px; font: 13px/1.45 system-ui, sans-serif; }
      /* Chrome shows a popup 600 px tall at most: the views scroll inside, the header, tabs and footer stay. */
      main { display: flex; flex-direction: column; max-height: 600px; }
      button { font: inherit; cursor: pointer; }
      p { margin: 0; }
      .head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; }
      .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--brand); color: #fff; display: grid; place-items: center; font: 700 11px system-ui; }
      .head b { font-size: 13px; }
      .pill { margin-left: auto; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); display: inline-flex; gap: 5px; align-items: center; max-width: 180px; }
      .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pill::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
      .pill.on::before { background: var(--ok); }
      .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
      .tabs button { background: none; border: 0; color: var(--muted); padding: 7px 8px 8px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand); font-weight: 600; }
      .view { padding: 14px; display: grid; gap: 14px; overflow-y: auto; min-height: 0; align-content: start; }
      h5 { margin: 0; font: 600 11px system-ui; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .link { background: none; border: 0; padding: 0; color: var(--brand); font: 500 12px system-ui; text-decoration: underline; text-underline-offset: 2px; }
      .muted { color: var(--muted); }
      .sm { font-size: 12px; }
      .warn { color: var(--warn); }
      .blk { display: grid; gap: 8px; }
      .host { font: 600 15px system-ui; overflow-wrap: anywhere; }
      .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
      .btn.block { width: 100%; padding: 8px 12px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
      .seg > button, .seg > label { border: 0; background: transparent; color: inherit; padding: 6px 4px; border-left: 1px solid var(--line); text-align: center; white-space: nowrap; position: relative; cursor: pointer; }
      .seg > :first-child { border-left: 0; }
      .seg > [aria-pressed="true"], .seg > label:has(input:checked) { background: var(--brand); color: #fff; font-weight: 600; }
      .seg > button:disabled { color: var(--muted); cursor: default; opacity: .55; }
      .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
      .seg > label:has(input:focus-visible) { outline: 2px solid var(--brand); outline-offset: -2px; }
      label.chk { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
      input[type="checkbox"] { accent-color: var(--brand); margin: 2px 0 0; }
      .last { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
      .last .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
      .last .l1 span:last-child:not(:first-child) { font-weight: 400; color: var(--muted); white-space: nowrap; }
      .last.wait { border-color: var(--wait); }
      .last.bad { border-color: var(--warn); }
      .foot { display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding: 10px 14px; }
      ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
      ol.steps li { counter-increment: s; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: center; }
      ol.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 600 12px system-ui; color: var(--muted); }
      ol.steps li.done::before { content: "\2713"; background: var(--ok); border-color: var(--ok); color: #fff; }
      ol.steps li > div { display: grid; gap: 6px; justify-items: start; }
      ul.list { list-style: none; margin: 0; padding: 0; display: grid; }
      ul.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--line); align-items: center; }
      ul.list li:first-child { border-top: 0; padding-top: 0; }
      ul.list .a { font-weight: 500; overflow-wrap: anywhere; }
      ul.list .b { grid-column: 1; font-size: 12px; color: var(--muted); }
      ul.list .c { grid-row: 1 / span 2; grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
      ul.list .c.live { color: var(--ok); }
      ul.list li.solo { display: block; }
      #readings { max-height: 330px; overflow-y: auto; }
      select { font: inherit; font-size: 12px; padding: 3px 4px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: inherit; max-width: 124px; }
      .x { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 0 2px; }
      details summary { cursor: pointer; font-weight: 500; padding: 2px 0; }
      details[open] summary { margin-bottom: 8px; }
      .sw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
      .sw .warn { grid-column: 1 / -1; }
      input.toggle { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; margin: 0; cursor: pointer; }
      input.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .12s; }
      input.toggle:checked { background: var(--brand); }
      input.toggle:checked::after { left: 16px; }
      input.toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { input.toggle::after { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="head"><span class="logo">A</span><b>APC</b><span id="pill" class="pill"><span></span></span></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-view="page" aria-selected="true">This page</button>
        <button type="button" role="tab" data-view="activity" aria-selected="false">Activity</button>
        <button type="button" role="tab" data-view="settings" aria-selected="false">Settings</button>
      </div>
      <section id="view-page" class="view">
        <div id="here" class="blk"></div>
        <div id="last"></div>
      </section>
      <section id="view-activity" class="view" hidden>
        <ul id="readings" class="list"></ul>
        <div class="row">
          <button type="button" id="clear-readings" class="btn" title="Removes this list and any reading still at your dock. What your agent already read stays with it." hidden>Clear all</button>
          <button type="button" id="retry-readings" class="btn" hidden>Try again</button>
        </div>
      </section>
      <section id="view-settings" class="view" hidden>
        <div class="blk">
          <h5>Sites</h5>
          <div class="sw"><label for="any-page"><b>Every site</b></label><input type="checkbox" role="switch" class="toggle" id="any-page" /></div>
          <details id="sites-fold"><summary id="sites-summary">Your sites</summary><ul id="sites" class="list"></ul></details>
        </div>
        <div class="sw">
          <label for="never-ask"><b>Never ask</b></label><input type="checkbox" role="switch" class="toggle" id="never-ask" />
          <span class="warn sm">Sends every drop at once, even on sensitive sites.</span>
        </div>
        <div class="blk">
          <h5>Card, account and id numbers</h5>
          <div class="seg" role="group" aria-label="Card, account and id numbers">
            <label><input type="radio" name="sensitive" value="ask" />Ask</label>
            <label><input type="radio" name="sensitive" value="send" />Send</label>
            <label><input type="radio" name="sensitive" value="never" />Leave out</label>
          </div>
        </div>
        <div class="blk" id="agents-block">
          <h5>Paired agents</h5>
          <ul id="agents" class="list"></ul>
        </div>
        <div class="row sm"><a class="link" href="welcome.html" target="_blank" rel="noopener">How it works</a><button type="button" class="link" id="shortcuts">Shortcuts</button><span id="version" class="muted" style="margin-left: auto"></span></div>
      </section>
      <div id="foot" class="foot" hidden></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
