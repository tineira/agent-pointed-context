[package]
name = "apc-dock"
# Builds get 0.2.<commits on main> from scripts/build.mjs (TIN-615); this is a plain `cargo` build's.
version = "0.2.0"
description = "The APC agent dock for Windows: always on top, a global shortcut, a tray icon"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
# Signed auto-update (TIN-615): the update's question in a native dialog, the update from the dock-desktop prerelease.
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# The pets (TIN-479): window regions, so only the logo, its grip and its bubble take clicks; the
# mouse button, to tell when a move by the grip ends (TIN-484); showing a pet without activating it; a
# subclass, so activating a pet paints no title bar in it.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The version order the updater uses (update.rs tests); already in the lockfile through tauri.
semver = "=1.0.28"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
