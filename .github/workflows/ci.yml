name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history: the Dock freeze below diffs against the fetched base (a push's before SHA, a PR's
          # base branch).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      # The Dock freeze (TIN-1010): the Dock apps live in tineira/agent-dock now, which alone deploys apc-dock,
      # builds the extension zip and builds and signs Dock for Windows, and they were removed from this repo.
      # scripts/check-dock-freeze.mjs fails a diff that adds or modifies anything under the frozen paths, so this
      # job and every deploy behind it stop before Dock code comes back.
      - name: Dock freeze
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/check-dock-freeze.mjs --pull-request "$BASE"
          else
            node scripts/check-dock-freeze.mjs --push "$BEFORE"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Built Pulse and Signals pair with a stand-in hub in workerd. Node accepts fetch options Workers rejects
      # (redirect: "error" broke Dock pairing in production from APC 0.9 to 0.11.0).
      - name: Site, app pairing and wake budget in workerd
        run: pnpm test:workerd
        timeout-minutes: 3

  # The mobile rule (APC 0.6, TIN-608) in a real browser: Chrome at 375x812 with real touch events against Pulse and
  # Signals (their dev servers), running the conformance mobile checks. There is no DOM library in `pnpm test`, so the
  # real rendered bar is checked here, not in the node tests. It gates nothing: a deploy does not wait for it.
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start Pulse and Signals
        run: |
          (cd apps/demo && nohup node node_modules/vite/bin/vite.js --port 5301 --strictPort > /tmp/pulse.log 2>&1 &)
          (cd apps/signals && nohup node node_modules/vite/bin/vite.js --port 5302 --strictPort > /tmp/signals.log 2>&1 &)
          for p in 5301 5302; do
            for i in $(seq 1 60); do curl -sf "http://localhost:$p/" > /dev/null && break; sleep 1; done
          done
      - run: node scripts/mobile-e2e.mjs
      - if: failure()
        run: tail -n 40 /tmp/pulse.log /tmp/signals.log

  # A PR that changes more than docs adds an entry to CHANGELOG.md (or the standard's changelog), or carries the
  # no-changelog label (AGENTS.md, TIN-603). Pull requests only: it never runs on a push to main and gates no deploy.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the changelog
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-changelog.mjs "$BASE"

  # Which app a push to main touches. V1 is frozen in apps/v1 with its own copy of the APC code (TIN-604): only a
  # change under apps/v1/ deploys it. The standard is the site (apps/site, TIN-1006), Pulse for the standard (apps/demo,
  # TIN-382), Signals (apps/signals), the packages they share and the lockfile. The Dock apps (apps/dock,
  # apps/extension, apps/dock-desktop) moved to tineira/agent-dock and were removed here (TIN-1010); the Dock
  # freeze keeps them out. Pulse for desktop (apps/desktop*, TIN-396) deploys nothing
  # here either; a change to .github/ alone redeploys nothing (the next app change runs the new deploy steps).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.diff.outputs.v1 }}
      standard: ${{ steps.diff.outputs.standard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "v1=true" >> "$GITHUB_OUTPUT"; echo "standard=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          echo "v1=$(echo "$files" | grep -qE '^apps/v1/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "standard=$(echo "$files" | grep -qE '^(apps/site/|apps/signals/|apps/demo/|packages/|pnpm-lock\.yaml$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Every push to main that passes the checks and touches apps/v1 goes live at apc.tineira.com/v1 (Worker apc-demo,
  # through zone routes; the root is the dock's). It builds apps/v1 alone: nothing else in the repo
  # is part of V1. Needs the repository secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template) and
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy V1 (apc.tineira.com/v1)
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/v1 build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/v1
          packageManager: pnpm
          command: deploy

  # The APC standard: the site (apps/site, Worker apc-site, six zone routes), Pulse (apps/demo, Worker apc-pulse,
  # pulse.apc.tineira.com) and Signals (apps/signals, Worker apc-signals, signals.apc.tineira.com). The hub
  # (Worker apc-dock, apc.tineira.com) is no longer deployed here: it moved to tineira/agent-dock (TIN-1010),
  # whose deploy job is the only one that builds and deploys the hub; the smoke below checks that the apps
  # this job deploys still pair with the production hub it deploys. Both this job and V1 put Workers on the host
  # apc.tineira.com, so when V1 deploys in the same push this job waits for it and runs only if it succeeded or
  # was skipped.
  deploy-standard:
    name: Deploy the APC standard
    needs: [check, changes, deploy]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.standard == 'true' }}
    runs-on: ubuntu-latest
    # 10 for the builds and deploys, plus the smoke's 6.
    timeout-minutes: 16
    concurrency:
      group: deploy-standard
      cancel-in-progress: false
    environment:
      name: standard
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Pulse, Signals and the site, in their usual order. (The dock used to deploy after the apps: it read an
      # app's apc.json before pairing it, APC 0.5, TIN-579. Since TIN-1010 agent-dock deploys it and keeps that
      # order on its side.)
      - run: pnpm --dir apps/demo build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/signals build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/signals
          packageManager: pnpm
          command: deploy
      # The site's binding target and its zone routes must exist before a hub delegates / to the site:
      # agent-dock's hub pairs against them (TIN-1006, TIN-1010).
      - run: pnpm --dir apps/site build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          packageManager: pnpm
          command: deploy
      # A real use after the deploy (TIN-900): a new dock's agent pairs with a new Pulse sandbox through the
      # production hub (synthetic data, no secret), reads through it, gives the grant back, and both start over.
      # Since TIN-1010 the hub is whatever tineira/agent-dock last deployed: the smoke checks that the Pulse and
      # Signals this job just deployed still pair with it. The script tries twice, 20 s apart (a new version may
      # not have reached every edge yet), and keeps to its own 5-minute deadline, cleanup included, inside this
      # step's 6.
      # The deploy has ALREADY SHIPPED when this runs. Red here rolls nothing back: it marks this job failed so someone
      # looks (README.md, "Run it": what to check, and how to roll back by hand if pairing is really broken). Nothing
      # waits on this job: V1 deployed before it, and the desktop build is another workflow (the extension's moved
      # to tineira/agent-dock with its app, TIN-1010).
      - name: Smoke after deploy (already live; red = look, no rollback) - one real pairing through the production hub
        timeout-minutes: 6
        run: node scripts/dock-pairing.mjs --production
