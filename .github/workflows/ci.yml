name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A PR that changes more than docs adds an entry to CHANGELOG.md (or the standard's changelog), or carries the
  # no-changelog label (AGENTS.md, TIN-603). Pull requests only: it never runs on a push to main and gates no deploy.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the changelog
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-changelog.mjs "$BASE"

  # Which app a push to main touches. V1 is frozen in apps/v1 with its own copy of the APC code (TIN-604): only a
  # change under apps/v1/ deploys it. The standard is the dock (apps/dock), Pulse for the standard (apps/demo, TIN-382), Signals
  # (apps/signals), the packages they share and the lockfile. Pulse for desktop (apps/desktop*, TIN-396), the dock for
  # Windows (apps/dock-desktop, #84) and the browser extension (apps/extension) deploy nothing here; a change to .github/
  # alone redeploys nothing (the next app change runs the new deploy steps).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.diff.outputs.v1 }}
      standard: ${{ steps.diff.outputs.standard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "v1=true" >> "$GITHUB_OUTPUT"; echo "standard=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          echo "v1=$(echo "$files" | grep -qE '^apps/v1/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "standard=$(echo "$files" | grep -qE '^(apps/dock/|apps/signals/|apps/demo/|packages/|pnpm-lock\.yaml$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Every push to main that passes the checks and touches apps/v1 goes live at apc.tineira.com/v1 (Worker apc-demo,
  # through zone routes; the root is the dock's). It builds apps/v1 alone: nothing else in the repo
  # is part of V1. Needs the repository secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template) and
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy apc.tineira.com
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/v1 build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/v1
          packageManager: pnpm
          command: deploy

  # The APC standard: the dock and its hub (apps/dock, Worker apc-dock, apc.tineira.com), Pulse
  # (apps/demo, Worker apc-pulse, pulse.apc.tineira.com) and Signals (apps/signals, Worker
  # apc-signals, signals.apc.tineira.com). The dock owns the host apc.tineira.com as a Custom Domain, which
  # V1's Worker (apc-demo) must have released first (it keeps only the routes apc.tineira.com/v1*), so when
  # V1 deploys in the same push this job waits for it and runs only if it succeeded or was skipped.
  deploy-standard:
    name: Deploy the APC standard
    needs: [check, changes, deploy]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.standard == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-standard
      cancel-in-progress: false
    environment:
      name: standard
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/dock build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/dock
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/demo build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/signals build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/signals
          packageManager: pnpm
          command: deploy
