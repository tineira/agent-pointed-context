name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history: the dock and extension builds count commits for the extension's version
          # (scripts/lib/extension-version.mjs), and a shallow clone stops them.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # One real Dock pairing in the Workers runtime (TIN-900): the built dock and Pulse in workerd (Miniflare), with real
      # Durable Objects, pairing through /apc/pair, the owner's code, initialize and /apc/confirm. `pnpm test` runs on Node,
      # which accepts fetch options Workers rejects (redirect: "error" broke Dock pairing in production from APC 0.9 to 0.11.0).
      - name: Dock pairing in workerd
        run: node scripts/dock-pairing.mjs
        timeout-minutes: 3

  # The mobile rule (APC 0.6, TIN-608) in a real browser: Chrome at 375x812 with real touch events against Pulse and
  # Signals (their dev servers), running the conformance mobile checks. There is no DOM library in `pnpm test`, so the
  # real rendered bar is checked here, not in the node tests. It gates nothing: a deploy does not wait for it.
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Start Pulse and Signals
        run: |
          (cd apps/demo && nohup node node_modules/vite/bin/vite.js --port 5301 --strictPort > /tmp/pulse.log 2>&1 &)
          (cd apps/signals && nohup node node_modules/vite/bin/vite.js --port 5302 --strictPort > /tmp/signals.log 2>&1 &)
          for p in 5301 5302; do
            for i in $(seq 1 60); do curl -sf "http://localhost:$p/" > /dev/null && break; sleep 1; done
          done
      - run: node scripts/mobile-e2e.mjs
      - if: failure()
        run: tail -n 40 /tmp/pulse.log /tmp/signals.log

  # A PR that changes more than docs adds an entry to CHANGELOG.md (or the standard's changelog), or carries the
  # no-changelog label (AGENTS.md, TIN-603). Pull requests only: it never runs on a push to main and gates no deploy.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the changelog
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-changelog.mjs "$BASE"

  # Which app a push to main touches. V1 is frozen in apps/v1 with its own copy of the APC code (TIN-604): only a
  # change under apps/v1/ deploys it. The standard is the dock (apps/dock), Pulse for the standard (apps/demo, TIN-382), Signals
  # (apps/signals), the packages they share and the lockfile. A change to the browser extension (apps/extension; its zip
  # is published by extension.yml) redeploys the dock too: the dock bakes in the latest extension's version, so it can tell
  # a person theirs is out of date. Pulse for desktop (apps/desktop*, TIN-396) and the dock for Windows
  # (apps/dock-desktop, #84) deploy nothing here; a change to .github/ alone redeploys nothing (the next app change runs
  # the new deploy steps).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.diff.outputs.v1 }}
      standard: ${{ steps.diff.outputs.standard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "v1=true" >> "$GITHUB_OUTPUT"; echo "standard=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          echo "v1=$(echo "$files" | grep -qE '^apps/v1/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "standard=$(echo "$files" | grep -qE '^(apps/dock/|apps/signals/|apps/demo/|apps/extension/|packages/|pnpm-lock\.yaml$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Every push to main that passes the checks and touches apps/v1 goes live at apc.tineira.com/v1 (Worker apc-demo,
  # through zone routes; the root is the dock's). It builds apps/v1 alone: nothing else in the repo
  # is part of V1. Needs the repository secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template) and
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy V1 (apc.tineira.com/v1)
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/v1 build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/v1
          packageManager: pnpm
          command: deploy

  # The APC standard: the dock and its hub (apps/dock, Worker apc-dock, apc.tineira.com), Pulse
  # (apps/demo, Worker apc-pulse, pulse.apc.tineira.com) and Signals (apps/signals, Worker
  # apc-signals, signals.apc.tineira.com). The dock owns the host apc.tineira.com as a Custom Domain, which
  # V1's Worker (apc-demo) must have released first (it keeps only the routes apc.tineira.com/v1*), so when
  # V1 deploys in the same push this job waits for it and runs only if it succeeded or was skipped.
  deploy-standard:
    name: Deploy the APC standard
    needs: [check, changes, deploy]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.standard == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-standard
      cancel-in-progress: false
    environment:
      name: standard
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history: the dock bakes in the latest extension's version, a commit count.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The apps first, then the dock: the dock reads an app's apc.json before it pairs it (APC 0.5, TIN-579),
      # so a new file must be served before a dock that asks for it.
      - run: pnpm --dir apps/demo build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/signals build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/signals
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/dock build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/dock
          packageManager: pnpm
          command: deploy
      # A real use after the deploy (TIN-900): a new dock's agent pairs with a new Pulse sandbox through the production
      # dock (synthetic data, no secret), reads through it, gives the grant back, and both start over. Tried once more
      # after 20 s, in case the new version had not reached every edge yet.
      - name: Smoke - one real Dock pairing in production
        timeout-minutes: 3
        run: node scripts/dock-pairing.mjs --production || (sleep 20 && node scripts/dock-pairing.mjs --production)
