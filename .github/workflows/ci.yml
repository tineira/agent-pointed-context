name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Which app a push to main touches. V1 is frozen in apps/v1 with its own copy of the APC code (TIN-604): only a
  # change under apps/v1/ deploys it. v2 is the dock (apps/dock), Pulse for the standard (apps/demo, TIN-382), Signals
  # (apps/signals), the packages they share and the lockfile. Pulse for desktop (apps/desktop*, TIN-396), the dock for
  # Windows (apps/dock-desktop, #84) and the browser extension (apps/extension) deploy nothing here; a change to .github/
  # alone redeploys nothing (the next app change runs the new deploy steps).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.diff.outputs.v1 }}
      v2: ${{ steps.diff.outputs.v2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "v1=true" >> "$GITHUB_OUTPUT"; echo "v2=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          echo "v1=$(echo "$files" | grep -qE '^apps/v1/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "v2=$(echo "$files" | grep -qE '^(apps/dock/|apps/signals/|apps/demo/|packages/|pnpm-lock\.yaml$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Every push to main that passes the checks and touches apps/v1 goes live at apc.tineira.com/v1 (Worker apc-demo,
  # which also answers / with a redirect to /v1/ until phase 0c). It builds apps/v1 alone: nothing else in the repo
  # is part of V1. Needs the repository secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template) and
  # CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy apc.tineira.com
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.v1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/v1 build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/v1
          packageManager: pnpm
          command: deploy

  # APC v2: the dock and its hub (apps/dock, Worker apc-v2, v2.apc.tineira.com), Pulse for the standard
  # (apps/demo, Worker apc-v2-pulse, pulse.v2.apc.tineira.com) and Signals (apps/signals, Worker
  # apc-v2-signals, signals.v2.apc.tineira.com). Never apc.tineira.com.
  deploy-v2:
    name: Deploy v2.apc.tineira.com
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-v2
      cancel-in-progress: false
    environment:
      name: v2
      url: https://v2.apc.tineira.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/dock build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/dock
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/demo build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/demo
          packageManager: pnpm
          command: deploy
      - run: pnpm --dir apps/signals build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/signals
          packageManager: pnpm
          command: deploy
