name: Publish @tineira/apc-* to npm

# The four packages (@tineira/apc-protocol, @tineira/apc-server, @tineira/apc-web, @tineira/apc-conformance) go to
# npm as 0.x pre-releases on the `next` dist-tag (TIN-612), never `latest` before the standard is 1.0. A tag
# `apc-v<version>` publishes that version (the four package.json versions, which scripts/check-packages.mjs holds to
# APC_STANDARD_VERSION); running it by hand (workflow_dispatch) is a dry run that publishes nothing.
#
# npm trusted publishing (OIDC): no npm token anywhere. npm trusts this workflow file (publish.yml in
# tineira/agent-pointed-context) for each package, set once on npmjs.com after the bootstrap publish
# (scripts/publish-local.mjs; README "Using the packages"). It needs npm CLI 11.5.1+ on Node 22.14+, a GitHub-hosted
# runner, `id-token: write`, and each package.json's repository.url exactly https://github.com/tineira/agent-pointed-context.
# Provenance comes with it. pnpm builds and packs (it rewrites workspace:^ and publishConfig); npm publishes the
# tarballs, since npm is what trusted publishing documents.

on:
  push:
    tags: ["apc-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # A real publish only for a pushed apc-v* tag; anything else (a manual run) is a dry run.
      DRY_RUN: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/apc-v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (dist-tag commands over OIDC: 11.21.0 or 12.2.0); pinned.
      - run: npm install -g npm@12.2.1
      - name: Check Node and npm
        run: |
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<14)) { console.error("Node 22.14+ needed, got "+process.versions.node); process.exit(1) }'
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm 11.5.1+ needed, got "+process.argv[1]); process.exit(1) }' "$(npm --version)"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check the versions (and the tag)
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            node scripts/check-packages.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-packages.mjs
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack with pnpm
        run: pnpm -r --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/apc-tarballs"
      - name: Publish with npm (a dry run unless this is an apc-v* tag)
        run: |
          version=$(node -p 'require("./packages/protocol/package.json").version')
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          for p in protocol server web conformance; do
            npm publish "$RUNNER_TEMP/apc-tarballs/tineira-apc-$p-$version.tgz" --tag next --access public $flag
          done
